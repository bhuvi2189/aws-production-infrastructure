name: Build and Deploy with GitOps

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: weather-analytics

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::530540751236:role/GitHubActionsEKSRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t $ECR_REPOSITORY:${GITHUB_SHA} \
            ./weather-analytics

      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: weather-analytics:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Tag Docker image
        run: |
          docker tag \
            $ECR_REPOSITORY:${GITHUB_SHA} \
            530540751236.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${GITHUB_SHA}

      - name: Push Docker image
        run: |
          docker push \
            530540751236.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${GITHUB_SHA}

      - name: Update Kubernetes manifest
        run: |
          sed -i "s#image: .*weather-analytics:[^[:space:]]*#image: 530540751236.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${GITHUB_SHA}#" kubernetes/deployment.yaml

      - name: Commit and push manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add kubernetes/deployment.yaml

          if git diff --cached --quiet; then
            echo "No manifest changes"
            exit 0
          fi

          git commit -m "chore: update weather-analytics image to ${GITHUB_SHA}"
          git push
