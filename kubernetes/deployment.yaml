apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-analytics
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weather-analytics
  template:
    metadata:
      labels:
        app: weather-analytics
    spec:
      containers:
        - name: weather-analytics
          image: 530540751236.dkr.ecr.ap-south-1.amazonaws.com/weather-analytics:e811ad8bd653fa2a2332c336a48e43a7dc2d100b
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
